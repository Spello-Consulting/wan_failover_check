[project]
name = "wan-failover-check"
version = "1.0.1"
description = "WAN Failover Check"
readme = "README.md"
requires-python = ">=3.13"
service_name="wan-failover-check"
launch_path="wan_check.py"
dependencies = [
    "fastapi>=0.135.2",
    "flask>=3.1.3",
    "requests>=2.33.0",
    "uvicorn>=0.42.0",
]

[project.optional-dependencies]
all = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-dotenv>=0.5.2",
]

[tool.pyutil]
managed_scripts = ["launch.sh"]